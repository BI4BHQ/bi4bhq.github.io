name: Update Photo Manifest

on:
  push:
    branches:
      - main
    paths:
      - "assets/photos/**"
      - ".github/workflows/update-photo-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate photo manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("assets/photos")
          categories = [
              {"folder": "01-radio", "target": "photo-radio"},
              {"folder": "02-journeys", "target": "photo-journeys"},
              {"folder": "03-city-life", "target": "photo-city"},
              {"folder": "04-moments", "target": "photo-moments"},
          ]

          extensions = {".jpg", ".jpeg", ".png", ".webp", ".gif", ".jfif", ".HEIC"}

          result = []
          for category in categories:
              folder = root / category["folder"]
              photos = sorted(
                  p.name for p in folder.iterdir()
                  if p.is_file() and p.suffix.lower() in extensions
              ) if folder.exists() else []

              result.append({
                  "folder": category["folder"],
                  "target": category["target"],
                  "photos": photos
              })

          output = root / "manifest.json"
          output.write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/manifest.json
          git diff --cached --quiet || (
            git commit -m "Update photo manifest" &&
            git push
          )
