name: Update Article Manifest

on:
  push:
    branches:
      - main
    paths:
      - "content/articles/**"
      - ".github/workflows/update-article-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate article manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("content/articles")
          output = Path("assets/articles/manifest.json")
          output.parent.mkdir(parents=True, exist_ok=True)

          articles = []
          for path in sorted(root.glob("*.json")) if root.exists() else []:
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, OSError):
                  continue
              if not isinstance(data, dict):
                  continue
              articles.append({
                  "title": data.get("title", ""),
                  "date": data.get("date", ""),
                  "status": data.get("status", "draft"),
                  "cover": data.get("cover", ""),
                  "body": data.get("body", "")
              })

          output.write_text(
              json.dumps(articles, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/articles/manifest.json
          git diff --cached --quiet || (
            git commit -m "Update article manifest" &&
            git push
          )
