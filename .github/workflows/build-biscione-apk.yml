name: Build BISCIONE APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BISCIONE test APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools 

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Android project and build APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android/app/src/main/java/com/bi4bhq/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'BISCIONE'
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bi4bhq.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.bi4bhq.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">BISCIONE</string>
          </resources>
          EOF

          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#08090C" android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#C92332"
                  android:strokeWidth="9"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M69,20 C49,10 31,24 34,39 C37,54 69,48 74,63 C79,78 62,91 43,82" />
              <path android:fillColor="#C92332"
                  android:pathData="M67,13 C77,10 86,16 85,25 C84,34 75,38 67,32 C61,27 61,18 67,13 Z" />
              <path android:fillColor="#08090C" android:pathData="M76,19 L80,21 L76,23 Z" />
          </vector>
          EOF

          cat > android/app/src/main/java/com/bi4bhq/app/MainActivity.java <<'EOF'
          package com.bi4bhq.app;

          import android.app.Activity;
          import android.annotation.SuppressLint;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String HOME_URL = "https://bi4bhq.github.io";

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(8, 9, 12));
                  getWindow().setNavigationBarColor(Color.rgb(8, 9, 12));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(8, 9, 12));
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setLoadsImagesAutomatically(true);
                  webView.getSettings().setSupportZoom(false);
                  webView.getSettings().setBuiltInZoomControls(false);
                  webView.getSettings().setDisplayZoomControls(false);
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String host = uri.getHost();
                          if ("bi4bhq.github.io".equals(host)) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (Exception ignored) {
                          }
                          return true;
                      }
                  });

                  setContentView(webView);
                  if (savedInstanceState == null) {
                      webView.loadUrl(HOME_URL);
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  if (webView != null) {
                      webView.saveState(outState);
                  }
                  super.onSaveInstanceState(outState);
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

          gradle --no-daemon -p android :app:assembleDebug
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/BISCIONE.apk

      - name: Upload BISCIONE APK
        uses: actions/upload-artifact@v4
        with:
          name: BISCIONE-APK
          path: output/BISCIONE.apk
          if-no-files-found: error
          retention-days: 30
