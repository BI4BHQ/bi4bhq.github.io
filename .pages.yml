
media:
  - name: article_images
    label: 文章图片
    input: assets/articles
    output: /assets/articles
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif

content:
  - name: articles
    label: IL BISCIONE 文章
    type: collection
    path: content/articles
    format: json
    filename: "{primary}.json"
    view:
      primary: title
      fields:
        - title
        - date
        - status
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 文章标题
        type: string
        required: true
      - name: date
        label: 发布日期
        type: date
        required: true
      - name: status
        label: 发布状态
        type: select
        options:
          values:
            - label: 已发布
              value: published
            - label: 草稿
              value: draft
      - name: cover
        label: 封面图片
        type: image
      - name: body
        label: 正文内容
        type: rich-text
        options:
          format: html
          media: article_images
          path: assets/articles
