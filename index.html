<style>
:root{
  --bg:#08090c;
  --panel:#111318;
  --red:#c92332;
  --white:#f4f2ee;
  --muted:#a5a5aa;
  --line:rgba(255,255,255,.13);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
  "Microsoft YaHei",Arial,sans-serif;
  line-height:1.7;
}
a{color:inherit;text-decoration:none}
.container{width:min(1120px,90%);margin:auto}
header{
  position:sticky;top:0;z-index:10;
  background:rgba(8,9,12,.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.nav{
  min-height:72px;display:flex;
  align-items:center;justify-content:space-between;
  gap:20px;
}
.logo{font-size:22px;font-weight:800;letter-spacing:2px}
.logo span{color:var(--red)}
nav{display:flex;gap:22px;flex-wrap:wrap}
nav a{font-size:13px;color:#c7c7ca}
nav a:hover{color:#fff}
.hero{
  min-height:600px;
  display:flex;align-items:center;
  position:relative;overflow:hidden;
  background:
  linear-gradient(90deg,rgba(5,6,9,.48),rgba(5,6,9,.22)),
  url("assets/bi4bhq-banner.png") center/cover no-repeat,
  radial-gradient(circle at 80% 35%,#48151c,#08090c 60%);
  border-bottom:1px solid var(--line);
}
.hero:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,#08090c,transparent 35%);
  pointer-events:none;
}
.hero-content{position:relative;z-index:1;padding:90px 0}
.eyebrow{
  color:#e34b55;font-size:12px;
  letter-spacing:4px;text-transform:uppercase;
}
h1{
  font-size:clamp(58px,11vw,112px);
  line-height:1;margin:20px 0;
  letter-spacing:3px;font-weight:850;
}
h1 span{color:var(--red)}
.hero h2{
  font-size:clamp(17px,3vw,25px);
  font-weight:400;letter-spacing:3px;
}
.hero p{color:#c4c2c2;max-width:560px}
.buttons{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
.btn{
  display:inline-block;padding:12px 24px;
  border:1px solid var(--red);
  font-size:13px;letter-spacing:1px;
  transition:.2s;
}
.btn.primary{background:var(--red)}
.btn:hover{background:#fff;color:#111;border-color:#fff}
.section{padding:90px 0;border-bottom:1px solid var(--line)}
.section-title{
  font-size:30px;letter-spacing:2px;
  margin:0 0 10px;
}
.section-title span{color:var(--red)}
.subtitle{
  color:var(--muted);font-size:13px;
  letter-spacing:2px;margin-bottom:35px;
}
.about-text{max-width:760px;color:#c6c6c9}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  padding:26px;
  min-height:155px;
}
.card .number{
  color:var(--red);font-size:12px;
  letter-spacing:2px;margin-bottom:12px;
}
.card h3{font-size:19px;margin:0 0 8px}
.card p{font-size:14px;color:var(--muted);margin:0}
.station-value{font-size:22px;font-weight:700}
.station-label{
  font-size:11px;color:var(--red);
  letter-spacing:2px;margin-bottom:8px;
}
.qsl-card{
  min-height:230px;
  display:flex;flex-direction:column;
  justify-content:space-between;
  background:
    linear-gradient(145deg,rgba(180,20,35,.2),transparent 60%),
    #111318;
}
.qsl-card .big{
  font-size:38px;font-weight:800;letter-spacing:2px;
}
.qsl-card p{color:var(--muted);font-size:13px}
.qsl-link{
  display:inline-block;color:#fff;
  border-bottom:1px solid var(--red);
  padding-bottom:4px;font-size:13px;
}
.contact{
  text-align:center;
  background:linear-gradient(180deg,#111318,#08090c);
}
.contact .call{
  font-size:clamp(40px,9vw,76px);
  font-weight:850;letter-spacing:4px;
  color:var(--red);margin:20px 0;
}
footer{
  padding:30px 0;text-align:center;
  color:#777;font-size:11px;letter-spacing:1px;
}
footer strong{color:#ccc}
@media(max-width:650px){
  .nav{align-items:flex-start;padding:18px 0;flex-direction:column}
  nav{
    gap:12px 18px;
    flex-wrap:nowrap;
    max-width:100%;
    overflow-x:auto;
    padding-bottom:8px;
  }
  nav a{white-space:nowrap;flex:0 0 auto}
  .hero{min-height:540px}
  .hero-content{padding:70px 0}
  .section{padding:65px 0}
}

stify-content: center;<br/>  flex-direction: column;<br/>  padding: 30px;<br/>  background: rgba(0,0,0,.96);<br/>}<br/><br/>.photo-lightbox.active {<br/>  display: flex;<br/>}<br/><br/>.photo-lightbox img {<br/>  max-width: 95%;<br/>  max-height: 82vh;<br/>  object-fit: contain;<br/>}<br/><br/>.photo-lightbox-close {<br/>  position: absolute;<br/>  top: 22px;<br/>  right: 28px;<br/>  color: white;<br/>  font-size: 34px;<br/>  cursor: pointer;<br/>  background: none;<br/>  border: none;<br/>}<br/><br/>.photo-lightbox-caption {<br/>  color: #ccc;<br/>  margin-top: 18px;<br/>  font-size: 12px;<br/>  letter-spacing: 2px;<br/>}<br/><br/>@media(max-width:650px) {<br/>  .photo-grid {<br/>    grid-template-columns: repeat(2, 1fr);<br/>    gap: 9px;<br/>  }<br/><br/>  .photo-item:first-child {<br/>    grid-column: span 2;<br/>  }<br/><br/>  .photo-category {<br/>    margin-top: 40px;<br/>  }<br/><br/>  .photo-lightbox {<br/>    padding: 12px;<br/>  }<br/>}<br/>

<br/>/* ==============================<br/>   BI4BHQ PHOTO GALLERY SCRIPT<br/>   Automatically load photos from GitHub<br/>   ============================== */<br/><br/>const PHOTO_REPOSITORY = "BI4BHQ/bi4bhq.github.io";<br/>const PHOTO_BRANCH = "main";<br/><br/>const PHOTO_CATEGORIES = [<br/>  {<br/>    folder: "01-radio",<br/>    target: "photo-radio"<br/>  },<br/>  {<br/>    folder: "02-journeys",<br/>    target: "photo-journeys"<br/>  },<br/>  {<br/>    folder: "03-city-life",<br/>    target: "photo-city"<br/>  },<br/>  {<br/>    folder: "04-moments",<br/>    target: "photo-moments"<br/>  }<br/>];<br/><br/>const PHOTO_EXTENSIONS =<br/>  /\.(jpg|jpeg|png|webp|gif|avif)$/i;<br/><br/>// Generate a readable title from the filename<br/>function photoTitle(filename) {<br/>  return filename<br/>    .replace(/\.[^/.]+$/, "")<br/>    .replace(/[-_]/g, " ")<br/>    .replace(/\b\w/g, letter => letter.toUpperCase());<br/>}<br/><br/>// Load photos from GitHub<br/>async function loadPhotoCategory(category) {<br/>  const container = document.getElementById(category.target);<br/><br/>  if (!container) return;<br/><br/>  const apiURL =<br/>    `https://api.github.com/repos/${PHOTO_REPOSITORY}/contents/assets/photos/${category.folder}?ref=${PHOTO_BRANCH}`;<br/><br/>  try {<br/>    const response = await fetch(apiURL);<br/><br/>    if (!response.ok) {<br/>      throw new Error("GitHub API request failed");<br/>    }<br/><br/>    const files = await response.json();<br/><br/>    const photos = files.filter(file =><br/>      file.type === "file" &&<br/>      PHOTO_EXTENSIONS.test(file.name)<br/>    );<br/><br/>    container.innerHTML = "";<br/><br/>    if (photos.length === 0) {<br/>      container.innerHTML =<br/>        '<div class="photo-empty">PHOTOS COMING SOON</div>';<br/>      return;<br/>    }<br/><br/>    photos.sort((a, b) => a.name.localeCompare(b.name));<br/><br/>    photos.forEach(file => {<br/>      const item = document.createElement("div");<br/>      item.className = "photo-item";<br/><br/>      const img = document.createElement("img");<br/>      img.src = file.download_url;<br/>      img.alt = photoTitle(file.name);<br/>      img.loading = "lazy";<br/><br/>      const caption = document.createElement("div");<br/>      caption.className = "photo-caption";<br/>      caption.textContent = photoTitle(file.name);<br/><br/>      item.appendChild(img);<br/>      item.appendChild(caption);<br/><br/>      item.addEventListener("click", () => {<br/>        openPhoto(file.download_url, photoTitle(file.name));<br/>      });<br/><br/>      container.appendChild(item);<br/>    });<br/><br/>  } catch (error) {<br/>    console.error("Photo loading error:", error);<br/><br/>    container.innerHTML =<br/>      '<div class="photo-empty">PHOTOS COMING SOON</div>';<br/>  }<br/>}<br/><br/>// Open full-screen photo<br/>function openPhoto(src, title) {<br/>  const lightbox = document.getElementById("photoLightbox");<br/>  const image = document.getElementById("photoLightboxImage");<br/>  const caption = document.getElementById("photoLightboxCaption");<br/><br/>  image.src = src;<br/>  image.alt = title;<br/>  caption.textContent = title;<br/><br/>  lightbox.classList.add("active");<br/>  document.body.style.overflow = "hidden";<br/>}<br/><br/>// Close full-screen photo<br/>function closePhoto() {<br/>  const lightbox = document.getElementById("photoLightbox");<br/><br/>  lightbox.classList.remove("active");<br/>  document.getElementById("photoLightboxImage").src = "";<br/><br/>  document.body.style.overflow = "";<br/>}<br/><br/>// Close button<br/>document.getElementById("photoLightboxClose")<br/>  .addEventListener("click", closePhoto);<br/><br/>// Click outside the image to close<br/>document.getElementById("photoLightbox")<br/>  .addEventListener("click", event => {<br/>    if (event.target.id === "photoLightbox") {<br/>      closePhoto();<br/>    }<br/>  });<br/><br/>// ESC key to close<br/>document.addEventListener("keydown", event => {<br/>  if (event.key === "Escape") {<br/>    closePhoto();<br/>  }<br/>});<br/><br/>// Load all four categories<br/>PHOTO_CATEGORIES.forEach(loadPhotoCategory);<br/>
